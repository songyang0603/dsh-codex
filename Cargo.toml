[workspace]
members = [
  "crates/apply-patch-engine",
  "crates/approval-protocol-engine",
  "crates/execpolicy-engine",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/songyang0603/dsh-codex"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1.3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Match the pinned Codex workspace's exact crate substitutions. codex-config's
# transitive workspace dependencies require the proxy/deflate fork features.
[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
