version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Dependency revisions are coordinated with the pinned parity evidence.
    # Keep security updates available without opening routine version PRs.
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      # Codex dependency movement is handled only through the explicit
      # upstream-drift process and differential evidence.
      - dependency-name: codex-execpolicy
      - dependency-name: codex-shell-command
      - dependency-name: codex-config
      - dependency-name: codex-exec-server
      - dependency-name: codex-utils-absolute-path
      - dependency-name: codex-utils-cli
      - dependency-name: codex-utils-home-dir
